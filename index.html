<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CEO por un Día — Simulador Gerencial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--paper:#f3eedf;--panel:#e6dfc5;--ink:#202a20;--muted:#626b62;--line:#cec7ab;--green:#255d43;--green2:#d8e6dc;--red:#963f36;--red2:#f0dcd8;--white:#fff}
@media(prefers-color-scheme:dark){:root{--paper:#151b16;--panel:#222a22;--ink:#edf0e7;--muted:#aeb7ae;--line:#39423a;--green:#7fb28d;--green2:#1e3326;--red:#df8277;--red2:#392523;--white:#192019}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",Arial,sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background:linear-gradient(rgba(0,0,0,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.018) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:1080px;margin:auto;padding:18px 22px 50px;position:relative}
.nav{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:2px solid var(--ink);padding:12px 0 18px}.brand{font-family:Fraunces,Georgia,serif;font-size:20px;font-weight:800}.small{font-size:12px;color:var(--muted)}
h1,h2,h3{font-family:Fraunces,Georgia,serif}.hero{padding:58px 0 34px;display:grid;grid-template-columns:1.25fr .75fr;gap:30px;align-items:center}.hero h1{font-size:clamp(48px,7vw,82px);line-height:.92;margin:10px 0 20px}.lead{font-size:17px;line-height:1.65;color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:800}
.box,.game{border:1px solid var(--line);border-radius:22px;background:color-mix(in srgb,var(--white) 56%,transparent);padding:24px;box-shadow:0 18px 45px rgba(0,0,0,.06)}
.big{font:800 56px Fraunces,Georgia,serif;color:var(--red)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:0;border-radius:10px;background:var(--green);color:#fff;padding:15px 21px;font-weight:800;min-height:52px;cursor:pointer}.btn.secondary{background:transparent;color:var(--green);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--muted);border:1px dashed var(--line)}.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.screen{margin-top:28px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px dashed var(--line);padding-bottom:15px}.head h2{font-size:34px;margin:8px 0}
.companies{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.card{min-height:235px;border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:22px;text-align:left;cursor:pointer;color:var(--ink)}.card:hover,.option:hover{border-color:var(--green);transform:translateY(-2px)}.icon{font-size:38px}.card h3{font-size:22px;margin:14px 0 8px}.card p,.option span{font-size:13px;color:var(--muted);line-height:1.55}.label{display:inline-block;margin-top:16px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--green)}
.game{padding:0;overflow:hidden}.gamehead{padding:18px 22px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.progress{height:6px;background:rgba(100,110,103,.15)}.progress i{display:block;height:100%;background:var(--green)}.steps{display:flex;gap:8px;padding:14px 22px 0}.stepdot{width:29px;height:29px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--muted)}.stepdot.active{border-color:var(--green);color:var(--green);background:var(--green2)}.stepdot.done{background:var(--green);border-color:var(--green);color:#fff}
.scenario,.final,.consequence{padding:28px}.scenario h3{font-size:32px;margin:8px 0 12px}.alert{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--red);text-transform:uppercase}
.options{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:22px}.option{border:1px solid var(--line);border-radius:17px;background:var(--paper);padding:20px;min-height:145px;text-align:left;cursor:pointer}.option b{display:block;font-size:16px;margin-bottom:8px}
.side{padding:0 28px 28px}.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.meter{border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--panel)}.meter strong{display:block;font-size:12px}.meter small{display:block;margin-top:5px;color:var(--muted)}.bar{height:5px;background:rgba(120,130,123,.16);border-radius:9px;margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.history{margin-top:18px;border-top:1px solid var(--line);padding-top:13px}.row{padding:8px 0;border-bottom:1px solid rgba(120,130,123,.14);font-size:13px;color:var(--muted)}
.notice{margin-top:18px;border-radius:15px;background:var(--green2);padding:15px;line-height:1.55}.warn{margin-top:18px;border-radius:15px;background:var(--red2);padding:15px;line-height:1.55}
.formgrid,.finalgrid,.profilegrid,.consequencegrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:8px}.field label{font-weight:700;font-size:13px}.field input{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);outline:none}.field input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(37,93,67,.12)}
.consequencegrid{margin-top:22px}.delta{border:1px solid var(--line);border-radius:17px;padding:18px;background:var(--paper)}.delta-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(120,130,123,.14);font-size:13px}.plus{color:#2c7c52;font-weight:800}.minus{color:#a74d43;font-weight:800}.neutral{color:var(--muted);font-weight:800}
.finalgrid{margin-top:20px}.finalbox{border:1px solid var(--line);border-radius:16px;padding:17px;background:var(--paper)}.score{font:800 32px Fraunces,Georgia,serif;color:var(--green);margin-top:4px}.profile{margin-top:20px;border:1px solid var(--line);border-radius:18px;padding:20px;background:var(--paper)}.profile h3{font-size:27px;margin:5px 0 9px}.list{margin:7px 0 0;padding-left:20px;color:var(--muted);line-height:1.65}.status{font-size:13px;color:var(--muted)}.status.good{color:var(--green)}.email-status{margin-top:12px;font-size:13px;color:var(--green)}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding-top:34px}.companies,.options,.formgrid,.finalgrid,.profilegrid,.consequencegrid{grid-template-columns:1fr}.meters{grid-template-columns:1fr 1fr}.scenario,.final,.consequence{padding:21px}.side{padding:0 21px 21px}.nav{align-items:flex-start;flex-direction:column}}

/* --- Embellecimiento feria / libro contable --- */
body{background:radial-gradient(circle at 12% 10%,rgba(150,63,54,.06),transparent 24rem),radial-gradient(circle at 88% 18%,rgba(37,93,67,.07),transparent 26rem),var(--paper)}
.wrap{max-width:1120px}
.nav{position:relative}
.nav:after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:1px;background:var(--line);opacity:.7}
.hero{min-height:67vh;padding:58px 0 48px}
.hero>div:first-child{position:relative}
.hero>div:first-child:before{content:"01 / 06";position:absolute;top:-24px;left:0;font:600 10px/1 "IBM Plex Sans",sans-serif;letter-spacing:.16em;color:var(--red);opacity:.85}
.hero h1{letter-spacing:-.035em;text-wrap:balance}
.hero .lead{max-width:58ch}
.hero .actions .btn{box-shadow:0 10px 24px rgba(37,93,67,.17)}
.box{position:relative;overflow:hidden}
.box:before{content:"MODO FERIA";position:absolute;right:-27px;top:18px;transform:rotate(7deg);padding:7px 34px;background:var(--red);color:#fff;font-size:9px;font-weight:800;letter-spacing:.15em}
.box:after{content:"";position:absolute;inset:11px;border:1px dashed var(--line);border-radius:15px;pointer-events:none}
.card{position:relative;overflow:hidden;min-height:258px;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--green);opacity:.85}
.card:nth-child(2):before{background:#9d7c2d}
.card:nth-child(3):before{background:var(--red)}
.card:after{content:"";position:absolute;right:-28px;bottom:-34px;width:120px;height:120px;border:1px solid var(--line);border-radius:50%;opacity:.45}
.card:hover{box-shadow:0 18px 34px rgba(30,40,32,.1)}
.card .label{transition:letter-spacing .18s ease}
.card:hover .label{letter-spacing:.12em}
.gamehead{position:relative}
.gamehead:before{content:"";position:absolute;left:0;top:0;width:120px;height:3px;background:var(--red)}
.gamehead b{font-family:Fraunces,Georgia,serif;font-size:17px}
.steps{border-bottom:1px dashed var(--line);padding-bottom:14px}
.stepdot{transition:all .18s ease}
.stepdot.active{transform:scale(1.08);box-shadow:0 4px 12px rgba(37,93,67,.16)}
.scenario{background:linear-gradient(rgba(37,93,67,.025) 1px,transparent 1px),var(--paper);background-size:100% 31px}
.options{margin-top:26px}
.option{position:relative;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.option:after{content:"↗";position:absolute;right:15px;bottom:13px;color:var(--green);font-size:18px;opacity:.5}
.option:hover{box-shadow:0 12px 28px rgba(30,40,32,.08)}
.meter{transition:transform .16s ease,box-shadow .16s ease}
.meter:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(30,40,32,.06)}
.bar i{transition:width .5s ease}
.notice,.warn,.profile,.finalbox,.delta{box-shadow:0 8px 22px rgba(30,40,32,.045)}
.consequence{position:relative}
.consequence:before{content:"DECISIÓN REGISTRADA";position:absolute;right:22px;top:23px;border:2px solid var(--red);color:var(--red);padding:7px 10px;font-size:9px;font-weight:900;letter-spacing:.14em;transform:rotate(-3deg);opacity:.78}
.final{position:relative}
.final:before{content:"DICTAMEN";position:absolute;right:28px;top:25px;border:2px solid var(--red);color:var(--red);padding:8px 12px;font-size:10px;font-weight:900;letter-spacing:.16em;transform:rotate(4deg)}
.final h2{font-size:38px;letter-spacing:-.025em}
.profile{border-top:5px solid var(--green)}
.profile h3{font-size:31px}
@media(max-width:760px){.hero{min-height:auto}.hero>div:first-child:before{top:-18px}.box:before{right:-32px}.consequence:before,.final:before{position:static;display:inline-block;margin-bottom:14px;transform:rotate(-2deg)}.final h2{font-size:32px}}
</style>
</head>
<body>
<div class="wrap">
<div class="nav"><div class="brand">CEO POR UN DÍA</div><div class="small">3.º AÑO · TECNICATURA CONTABLE</div></div>

</div>
<script src="app.js"></script>
</body>
</html>
